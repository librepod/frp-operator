name: publish-chart

# Publishes the frp-operator Helm chart to the fork's OCI registry:
#   ghcr.io/librepod/charts/frp-operator:<chart-version>
#
# The operator *image* is published by publish.yml; this workflow publishes the
# *chart* so consumers (e.g. the marketplace Flux overlay) can pull a chart that
# matches the released image. Without it, only the image advances on each tag
# while the chart stays stale — see the chart/image split-brain that left the
# operator without a --frpc-default-image flag.
#
# The chart version is read from charts/frp-operator/Chart.yaml and is decoupled
# from the git tag (e.g. chart 1.7.0 ships appVersion 0.9.0).

on:
  workflow_dispatch:
  push:
    tags: [ 'v*.*.*' ]

env:
  REGISTRY: ghcr.io
  CHART_OCI_REPO: oci://ghcr.io/librepod/charts/frp-operator
  CHART_PATH: ./charts/frp-operator

jobs:
  chart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read chart version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(awk '/^version:/ {print $2; exit}' "${CHART_PATH}/Chart.yaml" | tr -d '"')
          if [ -z "${VERSION}" ]; then
            echo "::error::Could not read chart version from Chart.yaml"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Chart version: ${VERSION}"

      - name: Package chart
        run: |
          set -euo pipefail
          mkdir -p out
          helm package "${CHART_PATH}" -d out
          ls -la out/

      - name: Push chart
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          helm push "out/frp-operator-${VERSION}.tgz" "${CHART_OCI_REPO}"

      - name: Verify push
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          echo "Published ${CHART_OCI_REPO}:${VERSION}"
          helm pull "${CHART_OCI_REPO}" --version "${VERSION}" --destination /tmp/verify
          echo "Pull OK"
