operator:
  # image of frp-operator
  image: "ghcr.io/librepod/frp-operator"
  # tag of frp-operator image
  tag: "v0.8.0"
  # number of replica for deployment
  replica: 1

# frpc client image the operator deploys for each Client
frpc:
  # defaultImage is the frpc image used when a Client omits spec.podTemplate.image
  defaultImage: "fatedier/frpc:v0.65.0"

resources:
  limits:
    cpu: 200m
    memory: 100Mi
  requests:
    cpu: 100m
    memory: 20Mi
